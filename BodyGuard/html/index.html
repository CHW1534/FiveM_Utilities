<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BodyGuard Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu-container" class="hidden">
        <!-- Banner -->
        <div class="menu-banner">
            <span class="banner-title" id="banner-title">BODYGUARD</span>
        </div>

        <!-- Subtitle bar -->
        <div class="menu-subtitle" id="menu-subtitle">MENÚ PRINCIPAL</div>

        <!-- Items -->
        <div class="menu-items" id="menu-items"></div>

        <!-- Description box -->
        <div class="menu-description" id="menu-description"></div>

        <!-- Counter -->
        <div class="menu-counter">
            <span id="item-counter">1 / 5</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
