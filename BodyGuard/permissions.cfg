# ═══════════════════════════════════════════════════════════════════════════════
# BodyGuard — Permisos ACE
# ═══════════════════════════════════════════════════════════════════════════════
# Este archivo se carga automáticamente al iniciar el recurso BodyGuard.
# Edita las líneas de abajo según tu server.
#
# Para dar permisos a un jugador específico por license:
#   add_principal identifier.license:XXXXX group.admin
#
# Para dar permisos a un jugador específico por steam:
#   add_principal identifier.steam:XXXXX group.admin
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# Permiso: Usar el menú de guardaespaldas
# ─────────────────────────────────────────────────────────────────────────────
# Todos los jugadores pueden usar el menú por defecto.
# Si quieres restringirlo, comenta la línea de abajo y agrega permisos
# individuales o por grupo.
add_ace builtin.everyone "bodyguard.use" allow

# ─────────────────────────────────────────────────────────────────────────────
# Permiso: Comando /givemoney (admin)
# ─────────────────────────────────────────────────────────────────────────────
# Solo admins pueden dar dinero a otros jugadores.
add_ace group.admin "bodyguard.admin" allow

# ─────────────────────────────────────────────────────────────────────────────
# Permiso: Límite de guardaespaldas VIP
# ─────────────────────────────────────────────────────────────────────────────
# Si quieres que ciertos jugadores tengan más guardaespaldas (hasta 7),
# usa este permiso. Los jugadores normales usan el límite de config.lua.
# add_ace group.vip "bodyguard.vip" allow

# ─────────────────────────────────────────────────────────────────────────────
# Ejemplos de permisos por grupo:
# ─────────────────────────────────────────────────────────────────────────────
# Solo moderadores+ pueden usar guardaespaldas:
#   add_ace group.moderator "bodyguard.use" allow
#   add_ace group.admin "bodyguard.use" allow
#
# Solo admins pueden comprar vehículos:
#   add_ace group.admin "bodyguard.vehicles" allow
#
# Solo VIPs pueden usar tiers 3 y 4:
#   add_ace group.vip "bodyguard.tier3" allow
#   add_ace group.vip "bodyguard.tier4" allow
