<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Equipos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="hidden">
        <div class="overlay"></div>
        <div class="modal-container">
            <button id="close-btn" class="close-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>

            <header class="header">
                <div class="header-badge">SISTEMA DE OPERACIONES</div>
                <h1 id="ui-title">SELECCIÓN DE EQUIPOS</h1>
                <p id="ui-subtitle">Elige tu bando de operaciones. Serás teletransportado automáticamente a la base correspondiente.</p>
            </header>

            <main id="teams-grid" class="teams-grid">
                <!-- Team cards rendered dynamically via JS -->
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
